[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "periodicity-aware-volatility-lab"
version = "0.2.0"
description = "Reproducible HAR/HARP implementation and Monte Carlo study of periodicity-aware realized-volatility forecasting."
readme = "README.md"
authors = [{name = "Adam Polanský"}]
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
keywords = ["realized volatility", "HAR", "HARP", "Monte Carlo", "forecasting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "matplotlib==3.10.1",
  "PyYAML==6.0.2",
  "psutil==7.0.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.0"]
dev = ["pytest==8.3.5", "ruff==0.11.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
